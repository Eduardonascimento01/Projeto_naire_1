{% extends 'bases.html' %}

{% block page_title %}
    Editar Entrega | NAIRE
{% endblock %}

{% block container %}
<div class="container py-4">
    <div class="d-flex align-items-center gap-3 mb-3">
        <a href="{% url 'listar_entregas' %}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left"></i> Voltar
        </a>
        <div>
            <h1 class="h2 mb-1">Editar entrega #{{ entrega.id_entrega }}</h1>
            <p class="text-muted mb-0">Atualize o evento, o apoiador e a criança vinculados.</p>
        </div>
    </div>

    <form action="{% url 'atualiza_entrega' id_entrega=entrega.id_entrega %}" method="post" class="mt-4">
        {% csrf_token %}
        <div class="mb-3">
            <label for="id_evento" class="form-label">Evento</label>
            <select id="id_evento" name="id_evento" class="form-select" required>
                {% for item in eventos %}
                    <option value="{{ item.id_evento }}" {% if item.id_evento == entrega.id_evento %}selected{% endif %}>
                        {{ item.nome }} - {{ item.data_evento }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label for="id_mad_pad" class="form-label">Madrinha ou padrinho</label>
            <select id="id_mad_pad" name="id_mad_pad" class="form-select" required>
                {% for item in madrinhas_padrinhos %}
                    <option value="{{ item.id_mad_pad }}" {% if item.id_mad_pad == entrega.id_mad_pad %}selected{% endif %}>
                        {{ item.pnome }} {{ item.snome }}{% if item.flag_anonimo == 'S' %} (Anônimo){% endif %}
                    </option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-4">
            <label for="id_crianca" class="form-label">Criança</label>
            <select id="id_crianca" name="id_crianca" class="form-select" required>
                {% for item in criancas %}
                    <option value="{{ item.id_filho }}" {% if item.id_filho == entrega.id_crianca %}selected{% endif %}>
                        {{ item.pnome }} {{ item.snome }}
                    </option>
                {% endfor %}
            </select>
        </div>
        <div class="d-flex justify-content-end gap-2">
            <a href="{% url 'listar_entregas' %}" class="btn btn-outline-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary">
                <i class="bi bi-save"></i> Salvar alterações
            </button>
        </div>
    </form>
</div>
{% endblock %}
